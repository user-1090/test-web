<!doctype html>
<html lang="zh-CN">
    <head>
        <title>personal page</title>
        <style>
        html,body{
            height:100%;
            margin:0;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 80px;

            min-height: 100vh;

            background-color: black;
            color: white;
            text-align: center;
            padding-bottom: 40px;
        }
        h1{
            margin: 0;
            font-size: clamp(36px, 6vw, 120px);
            color: gold;
        }
        h2{
            margin: 0;
            margin-top: 10px;
            font-size: clamp(24px, 3
vw, 60px);
        }
        ul{
            list-style: none;
            padding: 0;
            margin-top: 40px;
            max-width: 600px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        li{
            background-color: #222;
            margin: 10px;
            font-size: clamp(16px, 2.5vw, 40px);
            padding: 5px;
            border-radius: 8px;
        }
        </style>
    </head>
    <body>
        <h1>MY PAGE</h1>
        <h2>--欢迎光临--</h2>
        <ul>
            <li>吃饭</li>
            <li>睡觉</li>
        </ul>
    </body>
</html>
