<!doctype html>
<html lang="zh-CN">
    <head>
        <title>personal page</title>
        <style>
        body{
            background-color: black;
            color: white;
            text-align: center;
        }
        h1{
            margin: 0;
            margin-top: 180px;
            font-size: 55px;
            color: gold;
        }
        h2{
            margin: 0;
            margin-top: 10px;
            font-size: 30px;
        }
        ul{
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }
        li{
            background-color: #222;
            margin: 10px;
            font-size: 20px;
            padding: 5px;
            border-radius: 8px;
        }
        </style>
    </head>
    <body>
        <h1>MY PAGE</h1>
        <h2>欢迎光临</h2>
        <ul>
            <li>吃饭</li>
            <li>睡觉</li>
        </ul>
    </body>
</html>
